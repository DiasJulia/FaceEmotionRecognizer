<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Facial Emotion Recognition</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
	<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
	<main class="container py-5" style="max-width: 640px">
		<header class="text-center mb-4">
			<h1 class="h3 fw-semibold mb-3">Facial Emotion Recognition</h1>
			<p class="text-body-secondary mb-0">Send a picture of your face and see if an AI model can recognize your emotion.</p>
		</header>

		<section class="card card-body mb-3">
			<h2 class="h6">1. Image</h2>
			<div class="d-flex flex-wrap gap-2">
				<label class="btn btn-outline-primary mb-0">Upload photo<input id="file" type="file" accept="image/*" hidden></label>
				<button id="camera" class="btn btn-outline-primary">Use camera</button>
				<button id="capture" class="btn btn-primary" hidden>Capture</button>
			</div>
			<video id="video" class="w-100 rounded mt-3" autoplay playsinline muted hidden></video>
			<canvas id="preview" class="preview mt-3 rounded" width="48" height="48" hidden></canvas>
			<small class="text-body-secondary mt-2">Keep your face centered: the image is cropped to a square, converted to grayscale and resized to 48×48 like FER-2013.</small>
		</section>

		<section class="card card-body mb-3">
			<h2 class="h6">2. Model</h2>
			<select id="model" class="form-select mb-3"></select>
			<button id="predict" class="btn btn-success w-100" disabled>Predict emotion</button>
		</section>

		<section id="result" class="card card-body" hidden></section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
	<script type="module" src="script.js"></script>
</body>
</html>
